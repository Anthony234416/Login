<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attento - Login</title>
  <link rel="stylesheet" href="estilos/login.css">
</head>
<body>
  <main class="login">
    <header class="login__brand">
      <!-- COLOQUE SUA IMAGEM AQUI: troque "logo.png" pelo caminho do seu arquivo -->
      <img class="login__logo" src="logo.png" alt="Logo Attento">
      <h1 class="login__name">ATTENTO</h1>
      <p class="login__tagline">Saúde Integral</p>
    </header>

    <form class="login__form" action="#" method="post">
      <label for="usuario">Usuário/Administrador</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <div class="login__options">
        <label class="login__remember">
          <input type="checkbox" name="lembrar">
          <span>Lembrar</span>
        </label>
        <a href="esqueceu-senha.html">Esqueceu a senha?</a>
      </div>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
